[project]
name = "signal-to-draft"
version = "0.1.0"
description = "Prospect -> evidence-grounded personalised outreach draft"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    "sqlalchemy>=2.0",
    "psycopg[binary]>=3.2",
    "httpx>=0.27",
    "openai>=1.50",
    "instructor>=1.6",
    "tavily-python>=0.5",
    "exa-py>=1.5",
    "ddgs>=9.0",
    "trafilatura>=1.12",
    "htmldate>=1.9",
    "extruct>=0.17",
    "rank-bm25>=0.2.2",
    "rapidfuzz>=3.10",
    "feedparser>=6.0",
    "python-dateutil>=2.9",
    "sse-starlette>=2.1",
    "python-multipart>=0.0.12",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "respx>=0.21",
    "ruff>=0.7",
    "mypy>=1.13",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM", "RUF"]

[tool.mypy]
python_version = "3.12"
strict = true
plugins = ["pydantic.mypy"]
ignore_missing_imports = true

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["RUF001"]  # tests deliberately contain typographic punctuation
